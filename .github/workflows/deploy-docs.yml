
name: 部署文档

on:
  push:
    branches:
      - base  

permissions:
  contents: write
  
# 允许一个并发部署
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 如果你文档需要 Git 子模块，取消注释下一行
          # submodules: true


      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: |
          corepack enable
          npm ci

      - name: 构建文档
        env:
          NODE_OPTIONS: --max_old_space_size=8192
        run: |-
          npm run docs:build
          touch .vuepress/dist/.nojekyll

      - name: 部署文档
        uses: JamesIves/github-pages-deploy-action@v4
        env:
            GITHUB_TOKEN: ${{secrets.ACCESS_TOKEN}} # github上配置的 secrets名称为 ACCESS_TOKEN
        with:
          # 部署文档
          branch: online
          folder: .vuepress/dist #打包后的目录
          clean: true  # 清理旧文件
